# Not used until the (currently commented-out) sonarqube job in
# .github/workflows/ci.yml is enabled. Kept here so switching from
# Semgrep-only to Semgrep+SonarQube is a two-step process (add the
# SONAR_TOKEN secret, uncomment the job) instead of a research project.

sonar.projectKey=devsecops-notes-app
sonar.projectName=DevSecOps Notes App
sonar.sources=app,wsgi.py,config.py
sonar.tests=tests
sonar.python.version=3.12

# Feed pytest's coverage report in so Sonar shows line coverage, not
# just static-analysis findings. Generate it with:
#   pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
