[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["terraform", ".venv"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle basics, S: flake8-bandit-equivalent security
# rules (baseline SAST-ish checks that run in <1s, on top of Semgrep in CI),
# B: bugbear, I: import sort.
select = ["E", "F", "S", "B", "I"]
ignore = [
    "S101", # assert used (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
addopts = "-ra --cov=app --cov-report=term-missing"
testpaths = ["tests"]
