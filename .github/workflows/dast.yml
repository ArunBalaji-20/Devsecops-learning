name: DAST (OWASP ZAP baseline)

# Runs against whatever is CURRENTLY deployed — after a successful
# deploy, on a weekly schedule to catch drift/regressions, or on demand.
# This is a passive baseline scan (safe to run against a real
# environment — it doesn't try to exploit anything, just crawls and
# inspects responses). A full active scan is a natural next step once
# you're comfortable with what this one finds — see README.md.
on:
  workflow_run:
    workflows: ["CD (deploy to AWS)"]
    types: [completed]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: "Override the target URL instead of looking up the live deployment"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  zap-baseline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only needed when target_url wasn't given manually — look up
      # whatever's actually live from Terraform state.
      - name: Configure AWS credentials (OIDC, read-only use — just for `terraform output`)
        if: inputs.target_url == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        if: inputs.target_url == ''
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform init (read-only state access)
        if: inputs.target_url == ''
        working-directory: terraform
        run: terraform init -input=false

      - name: Resolve target URL
        id: target
        working-directory: terraform
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
          fi

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          # ZAP's default rule severities would fail the build on
          # low-severity informational findings too; start lenient and
          # tighten .zap/rules.tsv (create one) as you triage findings.
          cmd_options: "-I"
          allow_issue_writing: false
          fail_action: true
